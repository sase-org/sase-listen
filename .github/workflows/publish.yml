name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the existing release artifacts
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install built sase-listen wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Smoke check
        run: |
          /tmp/smoke-venv/bin/sase-listen --version
          /tmp/smoke-venv/bin/sase-listen doctor --json
      - name: Render smoke episode with the tone engine
        run: |
          DEMO_MD="$(/tmp/smoke-venv/bin/python -c "import pathlib, sase_listen; print(pathlib.Path(sase_listen.__file__).parent / 'data' / 'demo.md')")"
          /tmp/smoke-venv/bin/sase-listen render "$DEMO_MD" -n tone --json -o /tmp/smoke.mp3 > /tmp/smoke.json
          /tmp/smoke-venv/bin/python - <<'EOF'
          import json
          from mutagen.id3 import ID3
          payload = json.load(open("/tmp/smoke.json"))
          assert payload["ok"], payload
          assert len(payload["chapters"]) >= 2, payload
          tag = ID3("/tmp/smoke.mp3")
          assert sum(1 for k in tag if k.startswith("CHAP:")) == len(payload["chapters"])
          print("smoke episode:", payload["episode_id"], payload["duration_s"])
          EOF

  publish:
    needs: [release, build, install-smoke]
    if: ${{ needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing == true) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
